services:
  db:
    image: postgres:13
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      otterverse-net:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./backend/migrations:/app/migrations
      - ./shared:/app/shared
      - /app/backend/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - BASE_URL=${PROTOCOL}://${DOMAIN}:5000
    env_file:
      - .env
    restart: unless-stopped
    networks:
      otterverse-net:
        aliases:
          - chronoquest-backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:4173"
    volumes:
      - ./frontend:/app
      - ./shared:/app/shared
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${PROTOCOL}://${DOMAIN}:5000
    env_file:
      - .env
    restart: unless-stopped
    networks:
      otterverse-net:
        aliases:
          - chronoquest-frontend

networks:
  otterverse-net:
    external: true

volumes:
  db_data:
